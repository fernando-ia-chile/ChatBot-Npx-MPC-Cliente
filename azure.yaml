# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: mcp-host-app
metadata:
  template: mcp-host-app@0.0.1-beta
hooks:
  postprovision:
    shell: sh
    run: |
      echo "Configurando la autenticación del registro de contenedores..."
      # Compila y envía la imagen del contenedor
      az acr build --registry $AZURE_CONTAINER_REGISTRY_NAME --image aspnet-npx:latest .
      
      echo "Actualizando la configuración del contenedor de la aplicación web..."
      # Implementa la actualización de configuración del contenedor usando Bicep
      az deployment group create \
        --resource-group $AZURE_RESOURCE_GROUP \
        --template-file ./infra/update-container.bicep \
        --parameters \
          appServiceName="$AZURE_APP_SERVICE_NAME" \
          containerRegistryLoginServer="$AZURE_CONTAINER_REGISTRY_ENDPOINT" \
          containerImageName="aspnet-npx:latest"
